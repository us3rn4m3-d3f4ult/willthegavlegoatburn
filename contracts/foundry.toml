[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = []

remappings = [
  "forge-std/=lib/forge-std/src/",
]

# Invariant runs are expensive; the CI profile raises them.
[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
