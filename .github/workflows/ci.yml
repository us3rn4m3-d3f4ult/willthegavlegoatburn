name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        # contracts/lib is gitignored on purpose (vendored deps are not committed),
        # so CI installs it the same way a contributor would.
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit
      - name: Test
        working-directory: contracts
        run: forge test -vv

  web:
    name: web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
